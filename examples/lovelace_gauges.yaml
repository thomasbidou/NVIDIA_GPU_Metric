# Lovelace cards for the NVIDIA GPU Stats integration.
#
# The integration creates TWO devices from one daemon:
#   - "NVIDIA RTX 6000 Ada Generation"  (GPU sensors)
#   - "AMD Ryzen 9 9900X 12-Core Processor"  (CPU + RAM sensors)
#
# In the UI, pick entities by NAME (the card editor's entity dropdown lists
# them under their device). The entity ids below are the expected slugs — if
# HA added a suffix (e.g. _2) just re-pick the right one in the dropdown.
#
# Ranges:
#   - percent gauges: 0..100
#   - GPU temperature: 0..90
#   - CPU temperature: 0..100 (Ryzen can exceed 90 under load)
#   - GPU memory GiB: 0..48   (47.988 GiB total)
#   - RAM GiB:         0..64  (60.4 GiB total)
#   - power W:         0..300 (300 W limit)

type: vertical-stack
title: "System — GPU + CPU"
cards:
  # ============================ GPU ============================
  - type: gauge
    name: GPU usage
    entity: sensor.nvidia_rtx_6000_ada_generation
    min: 0
    max: 100
    unit: "%"
    needle: true

  - type: gauge
    name: Memory usage
    entity: sensor.nvidia_rtx_6000_ada_generation_2
    min: 0
    max: 100
    unit: "%"
    needle: true

  - type: gauge
    name: Memory (GiB)
    entity: sensor.nvidia_rtx_6000_ada_generation_3
    min: 0
    max: 48
    unit: "GiB"
    needle: true

  - type: gauge
    name: Power draw
    entity: sensor.nvidia_rtx_6000_ada_generation_puissance
    min: 0
    max: 300
    unit: "W"
    needle: true

  - type: gauge
    name: Power usage
    entity: sensor.nvidia_rtx_6000_ada_generation_5
    min: 0
    max: 100
    unit: "%"
    needle: true

  - type: gauge
    name: Temperature
    entity: sensor.nvidia_rtx_6000_ada_generation_temperature
    min: 0
    max: 90
    unit: "°C"
    needle: true
    thresholds:
      - value: 70
        color: orange
      - value: 85
        color: red

  - type: gauge
    name: Fan
    entity: sensor.nvidia_rtx_6000_ada_generation_6
    min: 0
    max: 100
    unit: "%"
    needle: true

  # =========================== CPU ============================
  - type: markdown
    content: "<h3>CPU / RAM</h3>"

  - type: gauge
    name: CPU usage
    entity: sensor.amd_ryzen_9_9900x_12_core_processor
    min: 0
    max: 100
    unit: "%"
    needle: true

  - type: gauge
    name: CPU temperature
    entity: sensor.amd_ryzen_9_9900x_12_core_processor_temperature
    min: 0
    max: 100
    unit: "°C"
    needle: true
    thresholds:
      - value: 70
        color: orange
      - value: 85
        color: red

  - type: gauge
    name: RAM usage
    entity: sensor.amd_ryzen_9_9900x_12_core_processor_2
    min: 0
    max: 100
    unit: "%"
    needle: true

  - type: gauge
    name: RAM (GiB)
    entity: sensor.amd_ryzen_9_9900x_12_core_processor_3
    min: 0
    max: 64
    unit: "GiB"
    needle: true
